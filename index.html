<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>GymApp</title>
<meta name="theme-color" content="#161A17" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"><div class="pantalla-carga">Cargando…</div></div>
  <!-- Vive fuera de #app a propósito: debe sobrevivir a que render()
       reemplace app.innerHTML al cambiar de pantalla, para que una
       generación de rutina en curso siga siendo visible aunque el
       usuario navegue a otra sección. Ver actualizarIndicadorGeneracion()
       en app.js. -->
  <div id="indicador-generacion"></div>
  <div id="nav-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="app.js"></script>
  <!-- GymApp 2.0 "Hoy" experience (GA-005) — a native ES module, loaded
       separately from app.js because app.js is a classic script and
       cannot use import/export. See src/today-experience/README.md. -->
  <script type="module" src="src/today-experience/browser-entry.mjs"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
